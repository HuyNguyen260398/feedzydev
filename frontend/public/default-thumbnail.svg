    <circle cx="96" cy="28" r="9" fill="#34d399"/>
    <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700">
      <text x="350" y="185" text-anchor="middle" font-size="84" fill="#e2e8f0">&gt; feedzy<tspan fill="#22d3ee">dev</tspan>_</text>
      <text x="350" y="245" text-anchor="middle" font-size="26" font-weight="500" fill="#94a3b8" letter-spacing="3">DEVOPS · CLOUD · SRE</text>
