  <circle cx="0" cy="720" r="60" fill="#22d3ee" fill-opacity="0.18"/>
  <circle cx="1280" cy="0" r="60" fill="#22d3ee" fill-opacity="0.18"/>

  <!-- terminal window -->
  <g transform="translate(290 210)">
    <rect width="700" height="300" rx="22" fill="#121a33" stroke="#22d3ee" stroke-opacity="0.45" stroke-width="3"/>
    <path d="M0 22a22 22 0 0 1 22-22h656a22 22 0 0 1 22 22v34H0z" fill="#1e293b"/>
